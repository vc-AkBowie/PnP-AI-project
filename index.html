<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>畫中畫無限縮放編輯器</title>
  <link rel="icon" href="icon/icon.png" type="image/png">
  <!-- 引入 JSZip 與 FileSaver (用於匯出 ZIP 打包檔), https://cdnjs.com/libraries/FileSaver.js/2.0.5, https://cdnjs.com/libraries/jszip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <!-- 引入範本檔（不受 CORS 限制，可直接雙擊開檔案執行） -->
  <script src="template.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; background: #f0f2f5; overflow: hidden; user-select: none; }
    
    /* 左側控制面板 */
    .sidebar { width: 380px; background: #fff; box-shadow: 2px 0 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; z-index: 10; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid #eee; background: #1a1a1a; color: #fff; }
    .sidebar-header h2 { margin: 0; font-size: 18px; }
    .sidebar-header p { margin: 5px 0 0 0; font-size: 12px; color: #aaa; }
    
    .layers-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
    
    .layer-card { background: #f8f9fa; border: 2px solid #ddd; border-radius: 8px; padding: 14px; cursor: pointer; transition: all 0.2s; position: relative; }
    .layer-card:hover { border-color: #aaa; }
    .layer-card.active { border-color: #007bff; background: #f0f7ff; box-shadow: 0 4px 12px rgba(0,123,255,0.15); }
    .layer-title { font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; font-size: 14px; color: #333; align-items: center; }
    
    .btn-delete { background: #dc3545; color: white; border: none; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    .btn-delete:hover { background: #bd2130; }

    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 12px; }
    .form-group label { color: #555; font-weight: 500; }
    .form-group input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; }
    .form-group input:focus { border-color: #007bff; outline: none; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    /* 檔案上傳排版 */
    .upload-row { display: flex; gap: 6px; align-items: center; }
    .btn-upload { background: #28a745; color: white; padding: 8px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; white-space: nowrap; }
    .btn-upload:hover { background: #218838; }
    .path-display { flex: 1; padding: 8px; background: #e9ecef; border: 1px dashed #ccc; border-radius: 4px; font-size: 11px; color: #666; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.btn { 
  padding: 12px 24px; 
  border: none; 
  border-radius: 50px; /* 設為較大的圓角值以達成圓角膠囊樣式 */
  cursor: pointer; 
  font-weight: bold; 
  transition: all 0.3s ease; 
  text-align: center; 
  font-size: 14px; 
  color: #ffffff;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); /* 增加輕微陰影提升質感 */
}

/* ＋ 新增圖片階段按鈕 (維持青綠/綠藍漸層) */
.btn-add { 
  background: linear-gradient(90deg, #17a2b8, #20c997); 
  margin: 15px 15px 5px 15px; 
}

/* 💾 匯出 HTML 網頁按鈕 (維持藍色/紫藍漸層) */
.btn-export { 
  background: linear-gradient(90deg, #007bff, #ff3bd8); 
  margin: 5px 15px 15px 15px; 
}

/* Hover 懸停效果 */
.btn:hover { 
  opacity: 0.95; 
  transform: translateY(-2px); 
  box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2); 
}

/* Click 點擊效果 */
.btn:active {
  transform: translateY(0);
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
}   


    /* 右側畫布預覽區 */
    .canvas-area { flex: 1; display: flex; flex-direction: column; position: relative; background: #e9ecef; overflow-y: auto; }
    
    /* 頂部控制列 */
    .toolbar { 
      height: 60px; 
      background: #fff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      gap: 15px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
      z-index: 5; 
      position: relative; /* 確保偽元素定位正確 */
    }

    /* 頂部控制列底部的漸層亮色邊框 (Gradient Line) */
    .toolbar::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px; /* 邊框厚度 */
      background: linear-gradient(90deg, #b026ff, #007bff, #00f2fe, #38ef7d); /* 紫 -> 藍 -> 青 -> 綠 漸層 */
    }
    .mode-btn { padding: 8px 16px; border-radius: 20px; border: 2px solid #ccc; background: #fff; cursor: pointer; font-weight: bold; color: #555; transition: all 0.2s; }
    .mode-btn.is-editing { border-color: #ff3b30; background: #fff0f0; color: #ff3b30; }
    .mode-btn.is-viewing { border-color: #007bff; background: #f0f7ff; color: #007bff; }

    .canvas-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 20px; min-height: 85vh; }
    .canvas-container { 
  width: 600px;             /* 1. 給予預設初始寬度 */
  height: 600px;            /* 2. 給予預設初始高度 */
  min-width: 300px;         /* 3. 設定最小可縮小的寬度 */
  min-height: 300px;        /* 4. 設定最小可縮小的高度 */
  background: #fff; 
  box-shadow: 0 15px 40px rgba(0,0,0,0.15); 
  border-radius: 4px; 
  overflow: hidden;         /* 保持 resize 運作必備條件 */
  position: relative; 

  /* 🎯 關鍵：啟用使用者手動拖拉伸縮 */
  resize: both;             /* 允許水平與垂直方向自由拉伸 */
}
    
    .preview-svg { width: 100%; height: 100%; display: block; background: #fafafa; }
    .preview-svg.mode-view { cursor: grab; }
    .preview-svg.mode-view:active { cursor: grabbing; }
    .preview-svg.mode-edit { cursor: move; }

    .info-overlay { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.85); color: #fff; padding: 8px 14px; border-radius: 20px; font-family: monospace; font-size: 13px; pointer-events: none; }
    .help-overlay { position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.6); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; pointer-events: none; }
    
    .notice-info { margin: 0 15px; padding: 10px; background: #eaf2ff; border: 1px solid #b8d5ff; border-radius: 6px; font-size: 11px; color: #004085; }
  </style>
</head>
<body>

  <!-- 左側控制面板 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Web版畫中畫 GUI 編輯器</h2>
      <p>開源程式(免安裝)</p>
    </div>
    <div class="layers-container" id="layersContainer"></div>
    
    <div class="notice-info">
      🔗 <b>提示：</b> 本程式採用cdnjs，所有上傳的圖片與檔案不會記錄在任何伺服器。匯出後請謹記解壓全部檔案！
    </div>

    <button class="btn btn-add" onclick="addLayer()">＋ 新增圖片階段 (Stage)</button>
    <button class="btn btn-export" onclick="exportHTML()">💾 匯出 HTML 網頁</button>
  </div>

  <!-- 右側實時預覽區 -->
  <div class="canvas-area">
    <div class="toolbar">
      <button id="btnModeView" class="mode-btn active-view" onclick="setMode('view')">👁️ 移動背景視角</button>
      <button id="btnModeEdit" class="mode-btn" onclick="setMode('edit')">🎯 調整紅框內嵌圖 (縮放/位移)</button>
    </div>

    <div class="canvas-wrapper">
      <div class="canvas-container" id="canvasContainer">
        <div class="info-overlay" id="infoOverlay">目前檢視：Stage 1</div>
        <div class="help-overlay" id="helpText">💡 提示：拖曳以平移背景，滾輪放大縮小背景視角</div>
        <svg class="preview-svg mode-view" id="previewSvg"></svg>
      </div>
    </div>
  </div>

<script>
let layers = [
  { stage: 1, path: "", previewSrc: "", baseSize: 700, x: 0, y: 0, scale: 1, trigger: 10000, file: null }
];

let activeStage = 1;
let interactionMode = 'view';

let viewStates = {
  1: { zoom: 1.0, focusX: 350, focusY: 350 }
};

let isDragging = false;
let lastMouseX, lastMouseY;

function init() {
  renderLayersControl();
  renderPreview();
  setupCanvasEvents();
}

function setMode(mode) {
  interactionMode = mode;
  const btnView = document.getElementById('btnModeView');
  const btnEdit = document.getElementById('btnModeEdit');
  const svg = document.getElementById('previewSvg');
  const help = document.getElementById('helpText');
  
  if (mode === 'view') {
    btnView.classList.add('is-viewing');
    btnEdit.classList.remove('is-editing');
    svg.className = "preview-svg mode-view";
    help.textContent = "💡 提示：拖曳以平移背景，滾輪放大縮小背景視角";
  } else {
    btnView.classList.remove('is-viewing');
    btnEdit.classList.add('is-editing');
    svg.className = "preview-svg mode-edit";
    help.textContent = "🎯 提示：在畫布上直接拖曳移動紅框，滾輪可放大縮小紅框圖片";
  }
  renderPreview();
}

function renderLayersControl() {
  const container = document.getElementById('layersContainer');
  container.innerHTML = '';
  layers.forEach((layer, index) => {
    const card = document.createElement('div');
    card.className = `layer-card ${layer.stage === activeStage ? 'active' : ''}`;
    
    card.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
      activeStage = layer.stage; 
      if (!viewStates[activeStage]) {
        viewStates[activeStage] = { zoom: 1.0, focusX: layer.baseSize / 2, focusY: layer.baseSize / 2 };
      }
      setMode('view');
      renderLayersControl(); 
      renderPreview();
    });

    const isLast = (index === layers.length - 1 && index > 0);
    const displayPath = layer.path ? layer.path : "尚未上傳圖片...";

    card.innerHTML = `
      <div class="layer-title">
        <span>階段 ${layer.stage} ${index === 0 ? '(底圖 Stage 1)' : `(內嵌在 Stage ${index} 內)`}</span>
        ${isLast ? `<button class="btn-delete" onclick="removeLastLayer(event)">刪除此階段</button>` : ''}
      </div>
      
      <div class="form-group">
        <div class="upload-row">
          <input type="file" id="file-uploader-${index}" accept="image/*" style="display: none;" onchange="handleFileUpload(event, ${index})">
          <button class="btn-upload" onclick="document.getElementById('file-uploader-${index}').click()">📁 上傳圖片</button>
          <div class="path-display" title="${displayPath}">${displayPath}</div>
        </div>
      </div>

      <div class="form-group">
        <label>畫布基準尺寸 (baseSize)</label>
        <input type="number" value="${layer.baseSize}" oninput="updateData(${index}, 'baseSize', Number(this.value))">
      </div>
    `;
    container.appendChild(card);
  });
}

function handleFileUpload(event, index) {
  const file = event.target.files[0];
  if (!file) return;

  const tempPreviewUrl = URL.createObjectURL(file);
  layers[index].file = file;
  layers[index].path = `Material/${file.name}`;
  layers[index].previewSrc = tempPreviewUrl;

  renderLayersControl();
  renderPreview();
}

function updateData(index, field, value) {
  layers[index][field] = value;
  if (field === 'baseSize' && layers[index].stage === activeStage) {
    viewStates[activeStage].focusX = value / 2;
    viewStates[activeStage].focusY = value / 2;
  }
  renderPreview();
}

function addLayer() {
  const newStage = layers.length + 1;
  if (layers.length > 0) {
    const prev = layers[layers.length - 1];
    prev.trigger = 10000; 
  }

  layers.push({ 
    stage: newStage, 
    path: "", 
    previewSrc: "", 
    baseSize: 1000, 
    x: 250, 
    y: 250, 
    scale: 0.3, 
    trigger: 10000,
    file: null
  });
  
  viewStates[newStage] = { zoom: 1.0, focusX: 500, focusY: 500 };
  activeStage = newStage;
  init();
}

function removeLastLayer(event) {
  if (event) event.stopPropagation();
  if (layers.length <= 1) return;

  layers.pop();
  const lastIndex = layers.length - 1;
  layers[lastIndex].trigger = 10000;
  if (activeStage > layers.length) activeStage = layers.length;
  init();
}

function buildRecursiveSVGElement(index) {
  const layer = layers[index];
  if (!layer) return null;

  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  const img = document.createElementNS("http://www.w3.org/2000/svg", "image");
  
  img.setAttributeNS("http://www.w3.org/1999/xlink", "href", layer.previewSrc || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23eee'/><text x='10' y='50' fill='%23999' font-size='12'>未上傳圖片</text></svg>");
  img.setAttribute("width", layer.baseSize);
  img.setAttribute("height", layer.baseSize);
  g.appendChild(img);

  const nextIndex = index + 1;
  const nextLayer = layers[nextIndex];

  if (nextLayer) {
    const subGroup = buildRecursiveSVGElement(nextIndex);
    if (subGroup) {
      subGroup.setAttribute("transform", `translate(${nextLayer.x}, ${nextLayer.y}) scale(${nextLayer.scale})`);
      g.appendChild(subGroup);
    }

    const isDirectNext = (layer.stage === activeStage);
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("width", nextLayer.baseSize);
    rect.setAttribute("height", nextLayer.baseSize);
    rect.setAttribute("vector-effect", "non-scaling-stroke");

    if (isDirectNext && interactionMode === 'edit') {
      rect.setAttribute("fill", "rgba(255, 59, 48, 0.08)");
      rect.setAttribute("stroke", "#ff3b30");
      rect.setAttribute("stroke-width", "2");
    } else {
      rect.setAttribute("fill", "none");
      rect.setAttribute("stroke", "rgba(255, 59, 48, 0.4)");
      rect.setAttribute("stroke-width", "1");
    }
    
    const rectGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
    rectGroup.setAttribute("transform", `translate(${nextLayer.x}, ${nextLayer.y}) scale(${nextLayer.scale})`);
    rectGroup.appendChild(rect);
    g.appendChild(rectGroup);
  }

  return g;
}

function renderPreview() {
  const svg = document.getElementById('previewSvg');
  svg.innerHTML = '';
  
  const currentLayerIndex = layers.findIndex(l => l.stage === activeStage);
  if (currentLayerIndex === -1) return;

  const currentLayer = layers[currentLayerIndex];
  const state = viewStates[activeStage];
  
  const viewWidth = currentLayer.baseSize / state.zoom;
  const viewHeight = currentLayer.baseSize / state.zoom;
  const viewX = state.focusX - viewWidth / 2;
  const viewY = state.focusY - viewHeight / 2;
  svg.setAttribute("viewBox", `${viewX} ${viewY} ${viewWidth} ${viewHeight}`);

  const recursiveTree = buildRecursiveSVGElement(currentLayerIndex);
  if (recursiveTree) svg.appendChild(recursiveTree);

  document.getElementById('infoOverlay').textContent = `檢視：Stage ${activeStage} (${state.zoom.toFixed(2)}x)`;
}

function setupCanvasEvents() {
  const canvas = document.getElementById('canvasContainer');
  
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const svg = document.getElementById('previewSvg');
    const rect = svg.getBoundingClientRect();
    const currentLayer = layers.find(l => l.stage === activeStage) || layers[0];
    const nextLayerIndex = layers.findIndex(l => l.stage === activeStage + 1);
    const state = viewStates[activeStage];

    const size = currentLayer.baseSize / state.zoom;
    const viewX = state.focusX - size / 2;
    const viewY = state.focusY - size / 2;
    
    // 正確取得相對座標
    const mouseX = viewX + ((e.clientX - rect.left) / rect.width) * size;
    const mouseY = viewY + ((e.clientY - rect.top) / rect.height) * size;

    if (interactionMode === 'edit' && nextLayerIndex !== -1) {
      const nextLayer = layers[nextLayerIndex];
      const factor = e.deltaY < 0 ? 1.05 : 0.95; 
      
      // 計算新的 scale 並加入限制防呆 (0.00001 ~ 100)
      const newScale = Math.min(Math.max(nextLayer.scale * factor, 0.00001), 100);
      const actualFactor = newScale / nextLayer.scale;
      
      const relX = mouseX - nextLayer.x;
      const relY = mouseY - nextLayer.y;
      nextLayer.x = mouseX - relX * actualFactor;
      nextLayer.y = mouseY - relY * actualFactor;
      nextLayer.scale = newScale;

      renderPreview();
    } else {
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      state.zoom = Math.max(0.1, state.zoom * factor);
      const newSize = currentLayer.baseSize / state.zoom;
      state.focusX = mouseX - ((e.clientX - rect.left) / rect.width) * newSize + newSize / 2;
      state.focusY = mouseY - ((e.clientY - rect.top) / rect.height) * newSize + newSize / 2;
      renderPreview();
    }
  });

  canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const svg = document.getElementById('previewSvg');
    const rect = svg.getBoundingClientRect();
    const currentLayer = layers.find(l => l.stage === activeStage) || layers[0];
    const nextLayerIndex = layers.findIndex(l => l.stage === activeStage + 1);
    const state = viewStates[activeStage];

    const deltaX = ((e.clientX - lastMouseX) / rect.width) * (currentLayer.baseSize / state.zoom);
    const deltaY = ((e.clientY - lastMouseY) / rect.height) * (currentLayer.baseSize / state.zoom);

    if (interactionMode === 'edit' && nextLayerIndex !== -1) {
      layers[nextLayerIndex].x += deltaX;
      layers[nextLayerIndex].y += deltaY;
    } else {
      state.focusX -= deltaX;
      state.focusY -= deltaY;
    }

    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    renderPreview();
  });

  window.addEventListener('mouseup', () => { isDragging = false; });
}

// 直接讀取全域變數 EXPORT_TEMPLATE 並替換下載
function exportHTML() {
  if (layers.length < 1) return;

  if (typeof EXPORT_TEMPLATE === 'undefined') {
    alert("找不到 template.js，請確定它與 editor.html 放在同一個資料夾內。");
    return;
  }

  // 1. 生成雙向完美的互動設定數據
  let stageConfigString = layers.map((l, idx) => {
    if (idx === 0) {
      const next = layers[1] || { x: 500, y: 500, scale: 0.1, baseSize: 1000 };
      return `  {
    stage: 1,
    baseSize: ${l.baseSize},
    minZoom: 1.0, 
    panelColor: "rgba(0, 0, 0, 0.85)", 
    panelPrefix: "",
    transitionTrigger: ${l.trigger},
    lockThreshold: Infinity,
    checkTargetValid: null,
    calculateNext: (x, y, currentZoom) => {
      const newX = (x - ${next.x}) / ${next.scale};
      const newY = (y - ${next.y}) / ${next.scale};
      const newZoom = currentZoom * ${next.scale} * (${next.baseSize} / ${l.baseSize}); 
      return { x: newX, y: newY, zoom: newZoom };
    }
  }`;
    } else {
      const prev = layers[idx - 1];
      const next = layers[idx + 1];
      // 🎯 精準計算進入此階段時的初始 Zoom (作為退回上一階段的 minZoom 觸發線)
      const entryZoom = prev.trigger * l.scale * (l.baseSize / prev.baseSize);

      return `  {
    stage: ${l.stage},
    baseSize: ${l.baseSize},
    minZoom: ${entryZoom}, 
    panelColor: "rgba(0, 32, 96, 0.85)", 
    panelPrefix: "階段${l.stage} ",
    transitionTrigger: ${l.trigger}, 
    lockThreshold: Infinity,
    checkTargetValid: null,
    calculateNext: (x, y, currentZoom) => {
      ${next ? `
      const newX = (x - ${next.x}) / ${next.scale};
      const newY = (y - ${next.y}) / ${next.scale};
      const newZoom = currentZoom * ${next.scale} * (${next.baseSize} / ${l.baseSize});
      return { x: newX, y: newY, zoom: newZoom };
      ` : `return { x: x, y: y, zoom: currentZoom };`}
    },
    calculatePrev: (x, y, currentZoom) => {
      // 🎯 對稱還原上一階段的座標與 Zoom
      const origX = x * ${l.scale} + ${l.x};
      const origY = y * ${l.scale} + ${l.y};
      const origZoom = currentZoom / (${l.scale} * (${l.baseSize} / ${prev.baseSize}));
      return { x: origX, y: origY, zoom: origZoom };
    }
  }`;
    }
  }).join(",\n");

  // 2. 遞迴生成 SVG 樹
  function buildExportSVGTree(index) {
    const l = layers[index];
    if (!l) return '';
    const next = layers[index + 1];
    let currentSrc = l.path || `Material/empty_stage${l.stage}.svg`;
    let innerHTML = `<g><image href="${currentSrc}" width="${l.baseSize}" height="${l.baseSize}"/></g>`;
    
    if (next) {
      const nextTree = buildExportSVGTree(index + 1);
      innerHTML += `\n      <g transform="translate(${next.x}, ${next.y}) scale(${next.scale})">${nextTree}</g>`;
    }
    return innerHTML;
  }

  let svgElementsString = layers.map((l, idx) => {
    const isFirst = idx === 0;
    const innerTree = buildExportSVGTree(idx);
    return `    <svg xmlns="http://www.w3.org/2000/svg" id="mysvg${l.stage}" viewBox="0 0 ${l.baseSize} ${l.baseSize}" style="display: ${isFirst ? 'block' : 'none'};">
    ${innerTree}
  </svg>`;
  }).join("\n");

  // 3. 代入 EXPORT_TEMPLATE
  const finalHTML = EXPORT_TEMPLATE
    .replace('/* {{STAGE_CONFIG}} */', stageConfigString)
    .replace('<!-- {{SVG_ELEMENTS}} -->', svgElementsString);

  // 4. 下載匯出檔 (打包成 ZIP 壓縮檔)
  if (typeof JSZip === 'undefined' || typeof saveAs === 'undefined') {
    alert("JSZip 或 FileSaver 載入失敗，請檢查網路連線。");
    return;
  }

  const zip = new JSZip();

  // 將 HTML 放到 ZIP 根目錄
  zip.file("index.html", finalHTML);

  // 建立 Material 資料夾放上傳的圖片
  const materialFolder = zip.folder("Material");

  // 遍歷所有階段，將上傳過的圖片存入 Material/
  layers.forEach((layer) => {
    if (layer.file) {
      materialFolder.file(layer.file.name, layer.file);
    }
  });

  // 打包並觸發下載
  zip.generateAsync({ type: "blob" }).then(function (content) {
    saveAs(content, "PnP_Deep_Recursive_Export.zip");
  });
}
init();
</script>
<script src="comments.js"></script>
</body>
</html>
